name: ci
# push — только main и release/*, ветки проверяются через pull_request: один прогон на коммит вместо двух (очередь macOS короче)
on:
  push: { branches: [main, "release/**"] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Google Chrome уже установлен на раннерах GitHub — сборщик использует его
      - run: npm test
