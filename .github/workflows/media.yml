name: media
# Скриншоты настоящего отчёта (реальные сайты; домены, названия и логотипы замыливаются)
on:
  workflow_dispatch:
  push:
    branches: ['media/**']
    paths: ['.github/workflows/media.yml', 'scripts/media/**']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITES: "https://www.florist.ru https://azalianow.ru https://kafe-dostavka.ru"
      TERMS: "florist.ru,флорист.ру,florist,azalianow,азалия нау,азалиянау,azalia,kafe-dostavka,колибри,kolibri"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Аудит трёх сайтов — свой первым, затем конкуренты
        run: |
          node dist/cli.js $SITES -p 12 -o report -f html,pdf,xlsx,md 2>&1 | tee terminal.log
      - run: node scripts/media/capture.mjs report terminal.log "$TERMS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media
          path: |
            media/
            report/*.md
