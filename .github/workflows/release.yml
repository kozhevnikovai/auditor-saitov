name: release
# Публикуете релиз в интерфейсе GitHub (тег vX.Y.Z) → тесты, сборка, к релизу прикладываются
# site-audit-ru.tgz (CLI и MCP через npx) и site-audit-ru.mcpb (расширение Claude Desktop).
# Пакет публикуется в npm через Trusted Publishing (OIDC); первый выпуск — по секрету NPM_TOKEN. SHA256SUMS — суммы файлов.
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack && mv site-audit-ru-*.tgz site-audit-ru.tgz
      - run: node scripts/build-mcpb.mjs
      - run: cp build/site-audit-ru.mcpb . && sha256sum site-audit-ru.tgz site-audit-ru.mcpb > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            site-audit-ru.tgz
            build/site-audit-ru.mcpb
            SHA256SUMS
      # Trusted Publishing (OIDC, без токена) — нужен npm 11.5+; первый выпуск нового пакета — по секрету NPM_TOKEN
      - run: npm install -g npm@latest
      - run: npm publish --access public
