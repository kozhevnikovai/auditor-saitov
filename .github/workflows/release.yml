name: release
# Публикуете релиз в интерфейсе GitHub (тег vX.Y.Z) → тесты, сборка, к релизу прикладываются
# site-audit-ru.tgz (CLI и MCP через npx) и site-audit-ru.mcpb (расширение Claude Desktop).
# Если в секретах репозитория есть NPM_TOKEN — пакет публикуется и в npm.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack && mv site-audit-ru-*.tgz site-audit-ru.tgz
      - run: node scripts/build-mcpb.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            site-audit-ru.tgz
            build/site-audit-ru.mcpb
      - name: npm publish (если задан NPM_TOKEN)
        continue-on-error: true
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public
