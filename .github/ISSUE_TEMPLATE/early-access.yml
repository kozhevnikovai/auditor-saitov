name: Ранний доступ к платным возможностям
description: Расскажите, какие возможности из раздела «Скоро» вам нужны — это влияет на порядок разработки
title: "Ранний доступ: "
labels: ["early-access"]
body:
  - type: markdown
    attributes:
      value: "Базовая версия остаётся бесплатной и открытой (MIT). Здесь — заявки на возможности, которых пока нет. Не пишите в заявке персональные данные и коммерческие тайны: страница публичная."
  - type: checkboxes
    attributes:
      label: Что вам нужно
      options:
        - label: "Регулярный мониторинг сайта и конкурентов по расписанию"
        - label: "Отчёт под брендом агентства (white-label), PDF"
        - label: "Проверка всего сайта (больше 30 страниц)"
        - label: "История изменений и уведомления о новых проблемах"
        - label: "Командный доступ и API"
  - type: input
    attributes: {label: Размер команды, placeholder: "например: 5 человек, отдел продаж"}
  - type: textarea
    attributes: {label: Какую задачу хотите решить, description: "Чем конкретнее, тем лучше"}
